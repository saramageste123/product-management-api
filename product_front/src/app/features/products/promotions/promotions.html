<div class="promotions-page" [class.blurred]="showModal()">

  <aside class="sidebar left">

    <div class="sidebar-top">
      <button class="action-icon back-btn" (click)="goBack()">
        <span class="material-symbols-rounded">keyboard_arrow_left</span>
      </button>
    </div>

  </aside>

  <div class="page-header">
    <h1>Promotions</h1>
  </div>

  <div class="actions-bar">

      <button class="delete-finished-btn" disabled>
        Delete finished
      </button>

      <button class="action-icon clean-filter-btn" [disabled]="!hasActiveFilters()" (click)="clearFilters()">
        <span class="material-symbols-rounded">filter_list_off</span>
      </button>

      <button class="action-icon add-btn" (click)="openCreateModal()">
        <span class="material-symbols-rounded">add</span>
      </button>

    </div>

    <div class="promotions-list">
      <app-promotions-list
        [promotions]="promotions()"
        [currentPage]="currentPage()"
        [totalPages]="totalPages()"
        [targetTypeFilter]="targetTypeFilter()"
        [startDateFilter]="startDateFilter()"
        [endDateFilter]="endDateFilter()"
        [statusFilter]="statusFilter()"
        (previousPage)="previousPage()"
        (nextPage)="nextPage()"
        (targetTypeFilterChange)="setTargetTypeFilter($event)"
        (startDateFilterChange)="setStartDateFilter($event)"
        (endDateFilterChange)="setEndDateFilter($event)"
        (statusFilterChange)="setStatusFilter($event)"
      ></app-promotions-list>
    </div>
    
</div>

@if (showModal()) {
  <app-promotion-form-modal
    [saving]="creatingPromotion()"
    [serverError]="createError()"
    (closed)="closeModal()"
    (save)="onCreatePromotion($event)"
  ></app-promotion-form-modal>
}
